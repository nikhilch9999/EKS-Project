apiVersion: apps/v1
kind: Deployment
metadata:
  name: fancy-dashboard
  namespace: default
  labels:
    app: fancy-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fancy-ui
  template:
    metadata:
      labels:
        app: fancy-ui
    spec:
      containers:
      - name: web-frontend
        image: nginxdemos/hello:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fancy-dashboard-svc
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: fancy-ui
