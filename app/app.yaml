apiVersion: apps/v1
kind: Deployment
metadata:
  name: fancy-dashboard
  namespace: default
  labels:
    app: fancy-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fancy-ui
  template:
    metadata:
      labels:
        app: fancy-ui
    spec:
      containers:
      - name: web-frontend
        # VERSION 1: Sleek Admin/Analytics dashboard layout
        image: ://microsoft.com
        ports:
        - containerPort: 80
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "wget -qO- https://githubusercontent.com > /usr/share/nginx/html/index.html"]
---
apiVersion: v1
kind: Service
metadata:
  name: fancy-dashboard-svc
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080  # Fixed port for easy access in KodeKloud
  selector:
    app: fancy-ui
