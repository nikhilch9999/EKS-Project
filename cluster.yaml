apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: demo-cluster
  region: us-east-1
  version: "1.31"

# Uses your pre-existing KodeKloud VPC and Subnets
vpc:
  id: "vpc-0ea4f485f80d74d31"
  subnets:
    public:
      us-east-1a:
        id: "subnet-0ffe1fa436f41ee03"
      us-east-1b:
        id: "subnet-0e67b279e8c5d221"

# Bypasses iam:PassRole block using the allowed sandbox service role
iam:
  serviceRoleARN: "arn:aws:iam::730335251706:role/eksClusterRole"

fargateProfiles:
  - name: fp-default
    selectors:
      - namespace: default
      - namespace: kube-system
